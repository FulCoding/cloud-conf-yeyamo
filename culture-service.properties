server.port=${SERVER_PORT:8115}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_culture}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
culture.events.topic=${CULTURE_EVENTS_TOPIC:culture.events}
artisan.events.topic=${ARTISAN_EVENTS_TOPIC:artisan.events}
jwt.secret=${JWT_SECRET}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID propagation
server.servlet.context-path=
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# Rate limiting hints (enforced by Gateway)
yeyamo.rate-limit.upload-audio=10
yeyamo.rate-limit.upload-artwork=20
yeyamo.rate-limit.contributions=30
yeyamo.rate-limit.translations=50
yeyamo.rate-limit.quiz-attempts=20
yeyamo.rate-limit.orders=30
yeyamo.rate-limit.reporting=10
