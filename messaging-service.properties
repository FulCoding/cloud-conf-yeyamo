server.port=${SERVER_PORT:8104}
eureka.client.register-with-eureka=true

spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:yeyamo_messaging}
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
spring.cassandra.request.timeout=${CASSANDRA_REQUEST_TIMEOUT:5s}
spring.cassandra.connection.connect-timeout=${CASSANDRA_CONNECT_TIMEOUT:5s}

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.messaging-events=${MESSAGING_EVENTS_TOPIC:messaging.events}

messaging.direct.max-members=2
messaging.group.max-members=${MESSAGING_GROUP_MAX_MEMBERS:100}
messaging.message.max-length=${MESSAGING_MESSAGE_MAX_LENGTH:4000}
messaging.message.max-attachments=${MESSAGING_MAX_ATTACHMENTS:10}
messaging.message.edit-window-minutes=${MESSAGING_EDIT_WINDOW_MINUTES:15}

# WebSocket Security & Performance
websocket.rate-limit.subscribe-per-minute=${WEBSOCKET_RATE_LIMIT_SUBSCRIBE:10}
websocket.heartbeat.client-ms=${WEBSOCKET_HEARTBEAT_CLIENT:10000}
websocket.heartbeat.server-ms=${WEBSOCKET_HEARTBEAT_SERVER:10000}
websocket.idle-timeout-ms=${WEBSOCKET_IDLE_TIMEOUT:300000}
websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*:*}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
info.app.description=YeYamo private realtime messaging service
