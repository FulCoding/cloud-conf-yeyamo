# Feed Service Configuration

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/feed_db
spring.datasource.username=${FEED_DB_USERNAME}
spring.datasource.password=${FEED_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Cache
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=feed-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
yeyamo.kafka.topics.post-events=post-events
yeyamo.kafka.topics.interaction-events=interaction-events

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10

# Ads Integration - Feature Flags
yeyamo.ads.enabled=${ADS_ENABLED:false}
yeyamo.ads.feed.enabled=${ADS_FEED_ENABLED:false}
yeyamo.ads.feed.max-per-page=${ADS_MAX_PER_PAGE:3}
yeyamo.ads.feed.organic-per-ad=${ADS_ORGANIC_PER_AD:8}

# Ads Delivery Service
yeyamo.ads.delivery-service.url=${ADS_DELIVERY_SERVICE_URL:http://ads-delivery-service:8080}
yeyamo.ads.timeout-ms=${ADS_TIMEOUT_MS:500}

# Circuit Breaker
yeyamo.ads.circuit-breaker.failure-threshold=${ADS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
yeyamo.ads.circuit-breaker.timeout-duration-ms=${ADS_CIRCUIT_BREAKER_TIMEOUT_MS:30000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://auth-service:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://auth-service:8080/.well-known/jwks.json}

# Logging
logging.level.com.yeyamo_mobile.api.feed_service=INFO
logging.level.com.yeyamo_mobile.api.feed_service.infrastructure.ads=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
