server.port=${SERVER_PORT:8088}

eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_catalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:catalog-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.catalog-events=${CATALOG_EVENTS_TOPIC:catalog.events}
yeyamo.kafka.topics.place-events=${PLACE_EVENTS_TOPIC:place.events}
yeyamo.kafka.topics.catalog-ingestion-events=${CATALOG_INGESTION_EVENTS_TOPIC:catalog.ingestion.events}
yeyamo.outbox.enabled=${CATALOG_OUTBOX_ENABLED:true}
yeyamo.outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:1000}

springdoc.swagger-ui.path=/swagger-ui.html

management.health.db.enabled=true
management.health.kafka.enabled=true
info.app.description=YeYamo tourism catalog and geographic assets service
logging.level.com.yeyamo_mobile.api.catalog_service=INFO
