server.port=${SERVER_PORT:8103}
eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_payments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.payment-commands=${PAYMENT_COMMANDS_TOPIC:payment.commands}
yeyamo.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment.events}
payment.outbox.enabled=${PAYMENT_OUTBOX_ENABLED:true}
payment.outbox.delay-ms=${PAYMENT_OUTBOX_DELAY_MS:1000}

payment.provider.name=${PAYMENT_PROVIDER_NAME:simulated}
payment.provider.simulated.decline-threshold=${PAYMENT_DECLINE_THRESHOLD:1000000.00}
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}
payment.webhook.tolerance-seconds=${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}

payment.aggregator.base-url=${PAYMENT_AGGREGATOR_BASE_URL:https://api.hrskills-pay.com}
payment.aggregator.key-a=${PAYMENT_AGGREGATOR_KEY_A:}
payment.aggregator.key-b=${PAYMENT_AGGREGATOR_KEY_B:}
payment.aggregator.webhook-secret=${PAYMENT_AGGREGATOR_WEBHOOK_SECRET:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
info.app.description=YeYamo payment authorization, refund and booking saga service
