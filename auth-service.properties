server.port=8082
eureka.client.register.with.eureka=true

spring.datasource.url=jdbc:postgresql://localhost:5432/auths
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

eureka.client.service-url.defaultZone=http://localhost:8081/eureka/


# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.previous-secrets=${JWT_PREVIOUS_SECRETS:}
jwt.issuer=${JWT_ISSUER:yeyamo-auth}
jwt.audience=${JWT_AUDIENCE:yeyamo-api}
jwt.key-id=${JWT_KEY_ID:primary}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=2592000000

# OAuth Configuration
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.apple.client-id=${APPLE_CLIENT_ID:}

# OTP Configuration
otp.expiration-minutes=10
otp.max-attempts=3

# Email Configuration (for OTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.email.delivery-enabled=${MAIL_DELIVERY_ENABLED:false}
auth.email.from-address=${EMAIL_FROM_ADDRESS:}
auth.email.from-name=${EMAIL_FROM_NAME:YeYamo}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:true}

# Security Configuration
security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
security.max-login-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
security.login-turnstile-threshold=${LOGIN_TURNSTILE_THRESHOLD:3}
auth.login.attempt-window=${AUTH_LOGIN_ATTEMPT_WINDOW:15m}
auth.login.lock-duration=${AUTH_LOGIN_LOCK_DURATION:15m}
security.turnstile.enabled=${TURNSTILE_ENABLED:false}
security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
security.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
security.turnstile.expected-hostname=${TURNSTILE_EXPECTED_HOSTNAME:yeyamo.com}
security.turnstile.timeout=${TURNSTILE_TIMEOUT:5s}
security.account-lockout-duration=15

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:auth-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
yeyamo.kafka.topics.user-events=${USER_EVENTS_TOPIC:user-events}
yeyamo.kafka.topics.partner-events=${PARTNER_EVENTS_TOPIC:partner-events}
yeyamo.outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:1000}

# Country configuration service used during registration validation.
# Docker Compose exposes this service internally on port 8117.
yeyamo.services.country-config.url=${COUNTRY_CONFIG_SERVICE_URL:http://country-config-service:8117}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Logging Configuration
logging.level.com.yeyamo_mobile.api.auth_service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.client=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
