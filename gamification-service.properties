server.port=${SERVER_PORT:8105}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_gamification}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:gamification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.user-events=${USER_V2_EVENTS_TOPIC:user.events}
yeyamo.kafka.topics.legacy-user-events=${USER_EVENTS_TOPIC:user-events}
yeyamo.kafka.topics.content-events=${CONTENT_EVENTS_TOPIC:content.events}
yeyamo.kafka.topics.interaction-events=${INTERACTION_EVENTS_TOPIC:interaction.events}
yeyamo.kafka.topics.booking-events=${BOOKING_EVENTS_TOPIC:booking.events}
yeyamo.kafka.topics.gamification-events=${GAMIFICATION_EVENTS_TOPIC:gamification.events}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
gamification.cache.ttl-seconds=${GAMIFICATION_CACHE_TTL_SECONDS:120}
gamification.outbox.enabled=true
gamification.outbox.delay-ms=${GAMIFICATION_OUTBOX_DELAY_MS:1000}
management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
