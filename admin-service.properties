server.port=${SERVER_PORT:8096}

eureka.client.register.with.eureka=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8081/eureka/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_admin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
yeyamo.kafka.topics.admin-events=${ADMIN_EVENTS_TOPIC:admin.events}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true

yeyamo.http.analytics-base-url=${ANALYTICS_SERVICE_URL:http://localhost:8097}
yeyamo.http.timeout-ms=${DOWNSTREAM_TIMEOUT_MS:1500}

logging.level.com.yeyamo_mobile.api.admin_service=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
