server.port=${SERVER_PORT:8099}

eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_referrals}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:referral-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.user-events=${USER_V2_EVENTS_TOPIC:user.events}
yeyamo.kafka.topics.legacy-user-events=${USER_EVENTS_TOPIC:user-events}
yeyamo.kafka.topics.mission-events=${MISSION_EVENTS_TOPIC:mission.events}
yeyamo.kafka.topics.referral-events=${REFERRAL_EVENTS_TOPIC:referral.events}
referral.outbox.enabled=true
referral.outbox.delay-ms=${REFERRAL_OUTBOX_DELAY_MS:1000}
referral.antifraud.max-daily-attributions=${REFERRAL_MAX_DAILY_ATTRIBUTIONS:20}
referral.antifraud.max-device-attributions=${REFERRAL_MAX_DEVICE_ATTRIBUTIONS:3}
referral.reward.referrer-amount=${REFERRAL_REFERRER_REWARD:100}
referral.reward.referred-amount=${REFERRAL_REFERRED_REWARD:50}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

management.health.db.enabled=true
management.health.kafka.enabled=true
management.health.redis.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
info.app.description=YeYamo referral programs and attribution service
logging.level.com.yeyamo_mobile.api.referral_service=INFO
