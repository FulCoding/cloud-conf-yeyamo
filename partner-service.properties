server.port=${SERVER_PORT:8087}
eureka.client.register-with-eureka=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_partners}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:partner-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.partner-events=${PARTNER_EVENTS_TOPIC:partner-events}
yeyamo.kafka.topics.admin-events=${ADMIN_EVENTS_TOPIC:admin.events}
yeyamo.outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:1000}
yeyamo.documents.storage-root=${PARTNER_DOCUMENT_ROOT:./data/partner-documents}
yeyamo.documents.max-size-bytes=${PARTNER_DOCUMENT_MAX_SIZE:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
management.health.db.enabled=true
management.health.kafka.enabled=true
info.app.description=YeYamo partner accounts and KYC service
logging.level.com.yeyamo_mobile.api.partner_service=INFO
