server.port=${SERVER_PORT:8101}

eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_media}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:media-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.media-events=${MEDIA_EVENTS_TOPIC:media.events}
media.outbox.enabled=${MEDIA_OUTBOX_ENABLED:true}
media.outbox.delay-ms=${MEDIA_OUTBOX_DELAY_MS:1000}
media.storage.local.root=${MEDIA_STORAGE_ROOT:./storage/media}
media.upload.max-image-bytes=${MEDIA_MAX_IMAGE_BYTES:10485760}
media.upload.max-video-bytes=${MEDIA_MAX_VIDEO_BYTES:104857600}
media.thumbnail.max-width=${MEDIA_THUMBNAIL_MAX_WIDTH:480}
media.thumbnail.max-height=${MEDIA_THUMBNAIL_MAX_HEIGHT:480}
media.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
media.video.ffmpeg-timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:20}
spring.servlet.multipart.max-file-size=${MEDIA_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MEDIA_MULTIPART_MAX_REQUEST_SIZE:101MB}
springdoc.swagger-ui.path=/swagger-ui.html

management.health.db.enabled=true
management.health.kafka.enabled=true
info.app.description=YeYamo media metadata and processing orchestration service
logging.level.com.yeyamo_mobile.api.media_service=INFO
