server.port=${SERVER_PORT:8094}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_notification}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.auth-events=${AUTH_EVENTS_TOPIC:auth.events}
yeyamo.kafka.topics.partner-events=${PARTNER_EVENTS_TOPIC:partner-events}
yeyamo.kafka.topics.moderation-events=${MODERATION_EVENTS_TOPIC:moderation.events}
yeyamo.kafka.topics.messaging-events=${MESSAGING_EVENTS_TOPIC:messaging.events}
notification.delivery.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
notification.delivery.base-delay-seconds=${NOTIFICATION_BASE_DELAY_SECONDS:30}
notification.delivery.poll-delay-ms=${NOTIFICATION_POLL_DELAY_MS:5000}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@yeyamo.app}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
notification.push.endpoint=${PUSH_PROVIDER_ENDPOINT:}
notification.push.api-key=${PUSH_PROVIDER_API_KEY:}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
