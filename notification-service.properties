server.port=${SERVER_PORT:8094}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_notification}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.auth-events=${AUTH_EVENTS_TOPIC:auth.events}
yeyamo.kafka.topics.partner-events=${PARTNER_EVENTS_TOPIC:partner-events}
yeyamo.kafka.topics.moderation-events=${MODERATION_EVENTS_TOPIC:moderation.events}
yeyamo.kafka.topics.messaging-events=${MESSAGING_EVENTS_TOPIC:messaging.events}
yeyamo.kafka.topics.newsletter-dispatch=${NEWSLETTER_DISPATCH_TOPIC:newsletter.dispatch}
newsletter.scheduler.delay-ms=${NEWSLETTER_SCHEDULER_DELAY_MS:30000}
admin.notifications.topic-pattern=${ADMIN_NOTIFICATION_TOPIC_PATTERN:partner-events|moderation\\.events|payment\\.events|booking\\.events|campaign\\.events|support\\.events|system\\.events|security\\.events}
admin.notifications.retention-cron=${ADMIN_NOTIFICATION_RETENTION_CRON:0 20 3 * * *}
notification.delivery.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
notification.delivery.base-delay-seconds=${NOTIFICATION_BASE_DELAY_SECONDS:30}
notification.delivery.poll-delay-ms=${NOTIFICATION_POLL_DELAY_MS:5000}
notification.email.delivery-enabled=${MAIL_DELIVERY_ENABLED:false}
notification.email.from-address=${EMAIL_FROM_ADDRESS:}
notification.email.from-name=${EMAIL_FROM_NAME:YeYamo}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.push.endpoint=${PUSH_PROVIDER_ENDPOINT:https://exp.host/--/api/v2/push/send}
notification.push.receipts-endpoint=${PUSH_RECEIPTS_ENDPOINT:https://exp.host/--/api/v2/push/getReceipts}
notification.push.receipts-delay-ms=${PUSH_RECEIPTS_DELAY_MS:300000}
notification.push.access-token=${PUSH_PROVIDER_ACCESS_TOKEN:}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
