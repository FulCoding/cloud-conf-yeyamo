server.port=${SERVER_PORT:8089}

eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_ingestion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:ingestion-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.catalog-ingestion-events=${CATALOG_INGESTION_EVENTS_TOPIC:catalog.ingestion.events}
ingestion.worker.enabled=${INGESTION_WORKER_ENABLED:true}
ingestion.worker.delay-ms=${INGESTION_WORKER_DELAY_MS:1000}
ingestion.outbox.enabled=${INGESTION_OUTBOX_ENABLED:true}
ingestion.outbox.delay-ms=${INGESTION_OUTBOX_DELAY_MS:1000}
ingestion.api.allowed-hosts=${INGESTION_API_ALLOWED_HOSTS:}
ingestion.api.max-response-bytes=${INGESTION_API_MAX_RESPONSE_BYTES:5000000}
ingestion.api.allow-http=${INGESTION_API_ALLOW_HTTP:false}
ingestion.api.allow-private-addresses=${INGESTION_API_ALLOW_PRIVATE_ADDRESSES:false}
ingestion.api.connect-timeout=${INGESTION_API_CONNECT_TIMEOUT:5s}
ingestion.api.read-timeout=${INGESTION_API_READ_TIMEOUT:15s}
ingestion.payload.max-records=${INGESTION_MAX_RECORDS:10000}
ingestion.payload.max-fields=${INGESTION_MAX_FIELDS:100}
ingestion.payload.max-value-length=${INGESTION_MAX_VALUE_LENGTH:10000}

management.health.db.enabled=true
management.health.kafka.enabled=true
info.app.description=YeYamo catalog ingestion and normalization service
logging.level.com.yeyamo_mobile.api.ingestion_service=INFO
