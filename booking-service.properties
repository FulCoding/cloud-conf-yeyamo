server.port=${SERVER_PORT:8102}
eureka.client.register-with-eureka=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_bookings}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:booking-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.booking-events=${BOOKING_EVENTS_TOPIC:booking.events}
yeyamo.kafka.topics.payment-commands=${PAYMENT_COMMANDS_TOPIC:payment.commands}
yeyamo.kafka.topics.payment-events=${PAYMENT_EVENTS_TOPIC:payment.events}
booking.outbox.enabled=true
booking.outbox.delay-ms=${BOOKING_OUTBOX_DELAY_MS:1000}
management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
info.app.description=YeYamo activity booking and payment saga service
