# Discovery Service Configuration

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/discovery_db
spring.datasource.username=${DISCOVERY_DB_USERNAME}
spring.datasource.password=${DISCOVERY_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Cache
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=discovery-service
spring.kafka.consumer.auto-offset-reset=earliest

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Ads Integration - Feature Flags
yeyamo.ads.enabled=${ADS_ENABLED:false}
yeyamo.ads.discovery.enabled=${ADS_DISCOVERY_ENABLED:false}
yeyamo.ads.discovery.max-per-page=${ADS_DISCOVERY_MAX_PER_PAGE:3}
yeyamo.ads.discovery.organic-per-ad=${ADS_DISCOVERY_ORGANIC_PER_AD:8}

# Ads Delivery Service
yeyamo.ads.delivery-service.url=${ADS_DELIVERY_SERVICE_URL:http://ads-delivery-service:8080}
yeyamo.ads.timeout-ms=${ADS_TIMEOUT_MS:500}

# Circuit Breaker
yeyamo.ads.circuit-breaker.failure-threshold=${ADS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
yeyamo.ads.circuit-breaker.timeout-duration-ms=${ADS_CIRCUIT_BREAKER_TIMEOUT_MS:30000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://auth-service:8080}

# Logging
logging.level.com.yeyamo_mobile.api.discovery_service=INFO
logging.level.com.yeyamo_mobile.api.discovery_service.infrastructure.ads=DEBUG
google.maps.api-key=${GOOGLE_MAPS_SERVER_API_KEY}
google.maps.base-url=${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com}
google.maps.routes-base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
discovery.opensearch.base-url=${OPENSEARCH_URL:http://localhost:9200}
discovery.opensearch.index=${OPENSEARCH_INDEX:yeyamo-discovery-v1}
