server.port=${SERVER_PORT:8095}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_recommendation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:recommendation-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.catalog-events=${CATALOG_EVENTS_TOPIC:catalog.events}
yeyamo.kafka.topics.content-events=${CONTENT_EVENTS_TOPIC:content.events}
yeyamo.kafka.topics.interaction-events=${INTERACTION_EVENTS_TOPIC:interaction.events}
yeyamo.kafka.topics.feed-events=${FEED_EVENTS_TOPIC:feed.events}
yeyamo.kafka.topics.user-events=${USER_V2_EVENTS_TOPIC:user.events}
yeyamo.kafka.topics.legacy-user-events=${USER_EVENTS_TOPIC:user-events}
yeyamo.kafka.topics.recommendation-events=${RECOMMENDATION_EVENTS_TOPIC:recommendation.events}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
recommendation.cache.ttl-seconds=${RECOMMENDATION_CACHE_TTL_SECONDS:120}
recommendation.scoring.popularity-weight=${RECOMMENDATION_POPULARITY_WEIGHT:1.0}
recommendation.scoring.proximity-weight=${RECOMMENDATION_PROXIMITY_WEIGHT:1.0}
recommendation.scoring.preferences-weight=${RECOMMENDATION_PREFERENCES_WEIGHT:1.0}
recommendation.scoring.history-weight=${RECOMMENDATION_HISTORY_WEIGHT:1.0}
recommendation.outbox.enabled=true
recommendation.outbox.delay-ms=${RECOMMENDATION_OUTBOX_DELAY_MS:1000}
management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
