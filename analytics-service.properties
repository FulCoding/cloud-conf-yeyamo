server.port=${SERVER_PORT:8097}

eureka.client.register.with.eureka=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8081/eureka/}

opensearch.uris=${OPENSEARCH_URIS:http://localhost:9200}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}
opensearch.connection-timeout=${OPENSEARCH_CONNECTION_TIMEOUT:2s}
opensearch.socket-timeout=${OPENSEARCH_SOCKET_TIMEOUT:10s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:analytics-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${ANALYTICS_KAFKA_CONCURRENCY:2}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

jwt.secret=${JWT_SECRET}
springdoc.swagger-ui.path=/swagger-ui.html

yeyamo.kafka.consumer.topics=${ANALYTICS_CONSUMER_TOPICS:user-events,partner-events,place.events,event.events,catalog.events,content.events,interaction.events,booking.events,payment.events,audit-events}
yeyamo.kafka.topics.audit-events=${AUDIT_EVENTS_TOPIC:audit-events}

analytics.query.max-range-days=366

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true

logging.level.com.yeyamo_mobile.api.analytics_service=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
