server.port=${SERVER_PORT:8095}

eureka.client.register.with.eureka=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8081/eureka/}

spring.elasticsearch.uris=${OPENSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${OPENSEARCH_USERNAME:}
spring.elasticsearch.password=${OPENSEARCH_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:analytics-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

yeyamo.kafka.consumer.topics=user-events,partner-events,place-events,social-events,graph-events,booking-events,audit-events
yeyamo.kafka.topics.audit-events=audit-events

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.elasticsearch.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true

logging.level.com.yeyamo_mobile.api.analytics_service=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n
