# ============================================================
# Culture & Artisan rate-limiting configuration
# Tighter limits for upload, contribution and quiz endpoints
# ============================================================
security.rate-limit.culture.upload-audio.requests=${RATE_LIMIT_CULTURE_UPLOAD_AUDIO:10}
security.rate-limit.culture.upload-artwork.requests=${RATE_LIMIT_CULTURE_UPLOAD_ARTWORK:20}
security.rate-limit.culture.contributions.requests=${RATE_LIMIT_CULTURE_CONTRIBUTIONS:30}
security.rate-limit.culture.translations.requests=${RATE_LIMIT_CULTURE_TRANSLATIONS:50}
security.rate-limit.culture.quiz-attempts.requests=${RATE_LIMIT_CULTURE_QUIZ:20}
security.rate-limit.culture.orders.requests=${RATE_LIMIT_CULTURE_ORDERS:30}
security.rate-limit.culture.reporting.requests=${RATE_LIMIT_CULTURE_REPORTING:10}
security.rate-limit.culture.window-seconds=${RATE_LIMIT_CULTURE_WINDOW_SECONDS:60}

resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.timelimiter.configs.default.timeout-duration=3s

management.health.redis.enabled=true
info.app.description=YeYamo edge API gateway
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=WARN

