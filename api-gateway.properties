server.port=${SERVER_PORT:8083}
#config eureka
eureka.client.register-with-eureka=true
#activation de la decouverte dynamique des microservices
eureka.client.fetch-registry=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=1500ms

jwt.secret=${JWT_SECRET}
yeyamo.security.trust-forwarded-proto=${TRUST_FORWARDED_PROTO:true}
yeyamo.security.requests-per-minute=${GATEWAY_REQUESTS_PER_MINUTE:300}
yeyamo.security.burst-capacity=${GATEWAY_BURST_CAPACITY:60}
security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*:*}
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:false}
security.rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
security.rate-limit.authentication-requests=${RATE_LIMIT_AUTHENTICATION_REQUESTS:20}
security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Routes Spring Cloud Gateway Server WebMVC
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=authService
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackPath=/fallback/auth-service

