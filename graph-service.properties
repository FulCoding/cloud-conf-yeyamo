server.port=${SERVER_PORT:8116}
spring.neo4j.uri=${NEO4J_URI:bolt://neo4j:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:CHANGE_ME}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=graph-service
springdoc.swagger-ui.path=/swagger-ui.html
yeyamo.kafka.topics.culture-events=${CULTURE_EVENTS_TOPIC:culture.events}
yeyamo.kafka.topics.catalog-events=${CATALOG_EVENTS_TOPIC:catalog.events}
yeyamo.kafka.topics.partner-events=${PARTNER_EVENTS_TOPIC:partner-events}
yeyamo.kafka.topics.place-events=${PLACE_EVENTS_TOPIC:place.events}
yeyamo.kafka.topics.event-events=${EVENT_EVENTS_TOPIC:event.events}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://registry-service:8761/eureka}
management.endpoints.web.exposure.include=health,info,metrics
