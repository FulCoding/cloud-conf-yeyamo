server.port=${SERVER_PORT:8098}

eureka.client.register-with-eureka=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeyamo_missions}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:mission-reward-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
yeyamo.kafka.topics.gamification-events=${GAMIFICATION_EVENTS_TOPIC:gamification.events}
yeyamo.kafka.topics.interaction-events=${INTERACTION_EVENTS_TOPIC:interaction.events}
yeyamo.kafka.topics.mission-events=${MISSION_EVENTS_TOPIC:mission.events}
mission.outbox.enabled=true
mission.outbox.delay-ms=${MISSION_OUTBOX_DELAY_MS:1000}

management.health.db.enabled=true
management.health.kafka.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
springdoc.swagger-ui.path=/swagger-ui.html
info.app.description=YeYamo missions rewards and progression rules service
logging.level.com.yeyamo_mobile.api.mission_reward_service=INFO
