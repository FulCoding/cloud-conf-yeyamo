project=Yeyamo-mobile
entreprise=Yeyamo holding

# Config Client Settings - Increased timeouts for Docker environment
spring.cloud.config.request-read-timeout=30000
spring.cloud.config.request-connect-timeout=10000
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=3000
spring.cloud.config.retry.multiplier=1.2

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.registry-fetch-interval-seconds=10
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=15
eureka.instance.lease-expiration-duration-in-seconds=45
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# OWASP-aligned HTTP baseline. Production overrides CORS_ALLOWED_ORIGINS explicitly.
yeyamo.security.enabled=true
yeyamo.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
yeyamo.security.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
yeyamo.security.allowed-headers=Authorization,Content-Type,X-Correlation-Id,Idempotency-Key,If-Match
yeyamo.security.allow-credentials=false
yeyamo.security.trust-forwarded-proto=false
yeyamo.security.max-uri-length=2048
yeyamo.security.max-query-length=4096
yeyamo.security.requests-per-minute=${SECURITY_REQUESTS_PER_MINUTE:600}
yeyamo.security.burst-capacity=${SECURITY_BURST_CAPACITY:120}
yeyamo.security.authentication-requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:20}
yeyamo.security.authentication-burst-capacity=${AUTH_BURST_CAPACITY:5}
yeyamo.security.max-tracked-clients=${SECURITY_MAX_TRACKED_CLIENTS:50000}

server.max-http-request-header-size=16KB
server.compression.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

jwt.issuer=${JWT_ISSUER:yeyamo-auth}
jwt.audience=${JWT_AUDIENCE:yeyamo-api}
jwt.key-id=${JWT_KEY_ID:primary}
jwt.previous-secrets=${JWT_PREVIOUS_SECRETS:}
jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
